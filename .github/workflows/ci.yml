name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet, Format, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Shell syntax
        run: bash -n scripts/pre-release-check.sh scripts/verify-scaffold.sh

      - name: Test
        run: go test -count=1 ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=5m

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Verify module checksums
        run: go mod verify

      - name: Run govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test with -race
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test with coverage
        run: |
          go test -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out > coverage.txt
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "Total coverage: ${total}%"
          # 当前基线约 65%（v1.0.0 前目标：P0-6 补齐 password/db/server/log 测试后提升到 75%）
          threshold=60
          awk -v total="$total" -v min="$threshold" 'BEGIN {
            if (total + 0 < min + 0) {
              printf "FAIL: total coverage %.1f%% is below the %d%% threshold\n", total, min
              exit 1
            }
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
          retention-days: 14

  scaffold:
    name: Scaffold E2E
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify scaffold (local mode)
        run: FRAMEWORK_LOCAL=1 ./scripts/verify-scaffold.sh
