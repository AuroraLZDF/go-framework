# Framework 配置示例

# 应用配置
app:
  name: my-application
  version: 1.0.0
  mode: debug  # debug, release, test

# 服务器配置
server:
  http-addr: :8080
  # 启用 HTTPS 时必须同时提供证书和私钥；仅配置 https-addr 时不再监听明文 HTTP，
  # 同时显式配置 http-addr 时该端口只负责 308 重定向到 HTTPS
  # https-addr: :8443
  # tls-cert: ./cert/server.crt
  # tls-key: ./cert/server.key
  shutdown-timeout: 10s
  read-header-timeout: 10s
  read-timeout: 30s
  write-timeout: 60s
  idle-timeout: 120s
  # 请求体大小上限（字节），默认 4MB，超限返回 HTTP 413
  max-body-bytes: 4194304
  # 可信代理（IP 或 CIDR），默认不信任任何代理；部署在反向代理之后时按需配置
  trusted-proxies: []

# 数据库配置
database:
  mysql:
    host: 127.0.0.1:3306
    username: root
    password: your_password
    database: mydb
    max-idle-connections: 10
    max-open-connections: 100
    max-connection-life-time: 30s
    log-level: 4  # 1: silent, 2: error, 3: warn, 4: info

# Redis 配置
redis:
  addr: 127.0.0.1
  port: 6379
  password: ""
  db: 0

# JWT 配置
jwt:
  secret: your-secret-key-change-in-production
  expire: 24  # 小时
  token-id: X-User-ID
  blacklist-prefix: "jwt:blacklist:"
  blacklist-fail-closed: false  # Redis 不可用时是否拒绝请求

# 日志配置
log:
  disable-caller: false
  disable-stacktrace: false
  level: info  # debug, info, warn, error
  format: json  # console, json
  dir: logs
